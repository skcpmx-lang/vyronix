name: Backend check (Windows)

# Compiles the Tauri backend for the Windows target on a Windows runner. This is a
# hard gate: any compile error fails the job.

on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/src-tauri/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/backend.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (provides dist for tauri::generate_context!)
        run: |
          cd apps/desktop
          npm ci --no-audit --no-fund
          npm run build

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-backend-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-backend-

      - name: cargo check (workspace)
        run: cargo check --workspace
