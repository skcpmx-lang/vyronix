[package]
name = "vyronix-desktop"
description = "VYRONIX — MERQO Windows PC & Laptop Diagnostic Ecosystem (native backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "vyronix-desktop"

[lib]
name = "vyronix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vyronix-core = { path = "../../../crates/vyronix-core" }
sysinfo = "0.32.1"
starship-battery = "0.11.1"
rusqlite = { version = "0.32", features = ["bundled"] }
log = { version = "0.4", features = ["std", "alloc"] }
fs2 = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wmi = "0.18.4"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_SystemInformation",
] }

[features]
# Tauri's custom-protocol feature is enabled by the tauri CLI for release builds.
custom-protocol = ["tauri/custom-protocol"]
